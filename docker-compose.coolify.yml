services:
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - target: 80
        published: false
    labels:
      - traefik.enable=true

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 3000
      ALLOWED_ORIGIN: '${ALLOWED_ORIGIN}'
      CONTACT_TO: '${CONTACT_TO}'
      CAPTCHA_SECRET: '${CAPTCHA_SECRET}'
      SMTP_HOST: '${SMTP_HOST}'
      SMTP_PORT: '${SMTP_PORT}'
      SMTP_SECURE: '${SMTP_SECURE}'
      SMTP_USER: '${SMTP_USER}'
      SMTP_PASS: '${SMTP_PASS}'
      SMTP_FROM: '${SMTP_FROM}'
